name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so no gradle-wrapper.jar needs to be committed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar (works on Forge 47.x and NeoForge 1.20.1)
        uses: actions/upload-artifact@v4
        with:
          name: bmdroles-mc1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
